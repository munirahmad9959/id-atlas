[project]
name = "id-atlas"
version = "0.1.0"
description = "Lightweight, self-hosted OCR for identity documents, starting with Costa Rica"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "munirahmad9959" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.5.4",
    # onnxruntime no longer ships macOS Intel wheels after 1.23.2.
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime>=1.23.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "rapidocr>=3.10.0",
    "uvicorn[standard]>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
