name: New document type or country
description: Ask for, or offer to add, support for another identity document
labels: ["new-document", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Please read the "Adding a document type or a country" section of CONTRIBUTING.md first.
        **Do not attach real identity documents.** Describe the layout in words, or use a synthetic mock-up.
  - type: input
    id: country
    attributes:
      label: Country
    validations:
      required: true
  - type: input
    id: document
    attributes:
      label: Document
      placeholder: "National ID card, driver's license, passport..."
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: Layout
      description: |
        Sides, printed labels (in the script the OCR can read, such as Latin), fields to extract, number
        and date formats, any check digit, barcode, QR code or machine-readable zone.
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Do you plan to contribute it?
      options:
        - "Yes, I will open a pull request"
        - "Maybe, with some help"
        - "No, I am only requesting it"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include any real identity document, photo or personal data.
          required: true
